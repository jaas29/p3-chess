name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (dev preset, UBSan)
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Unit tests
        run: |
          ./build/dev/bitboard_test
          ./build/dev/board_test
          ./build/dev/attacks_test
          ./build/dev/move_test
          ./build/dev/movegen_test
          ./build/dev/makemove_test
          ./build/dev/perft_test
